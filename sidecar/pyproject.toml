[project]
name = "orca-core"
version = "0.1.0"
description = "OrcaFlow Python sidecar — orchestrator, providers, tools, policy engine"
requires-python = ">=3.11"
authors = [{ name = "OrcaFlow" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "anyio>=4.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "structlog>=24.4",
    "python-slugify>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orca_core"]

# ---------- Ruff (formatter + linter) ----------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["orca_core", "tests"]
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                # isort
    "B",                # bugbear
    "C4",               # comprehensions
    "UP",               # pyupgrade
    "N",                # pep8-naming
    "S",                # bandit (security)
    "A",                # builtins shadow
    "SIM",              # simplify
    "PT",               # pytest-style
    "RET",              # return
    "TRY",              # tryceratops (exception hygiene)
    "PL",               # pylint (subset)
    "RUF",              # ruff specific
]
ignore = [
    "E501",  # line too long (formatter 담당)
    "PLR0913",  # too many arguments (clippy threshold와 맞춤)
    "TRY003",  # long messages in raise
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",   # asserts ok in tests
    "PLR2004", # magic values ok in tests
    "ARG",
    "S105",   # fake tokens in tests
    "S108",   # /tmp paths ok in tests
    "SIM117", # nested with ok in fixtures
    "PLC0415", # lazy imports ok in tests
    "RUF043", # match strings ok
]
"orca_core/schema/**" = ["A003"]
"orca_core/ipc/routes/**" = ["B008"]   # FastAPI Depends() idiom
"orca_core/ipc/routes/runs.py" = ["B008", "PLC0415"]   # inline per-run runner import

[tool.ruff.lint.isort]
known-first-party = ["orca_core"]
combine-as-imports = true
force-sort-within-sections = true

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

# Domain 계층은 엄격 모드
[[tool.mypy.overrides]]
module = [
    "orca_core.schema.*",
    "orca_core.policy.*",
    "orca_core.audit.*",
    "orca_core.journal.*",
]
strict = true
disallow_untyped_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------- Pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --cov=orca_core --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: unit tests",
    "integration: integration tests (sidecar HTTP)",
    "slow: slow tests (skipped by default)",
]

# ---------- Coverage ----------
[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 70

# ---------- Import Linter (레이어 경계) ----------
[tool.importlinter]
root_package = "orca_core"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain purity: schema/policy/audit/journal must not import infrastructure"
type = "forbidden"
source_modules = [
    "orca_core.schema",
    "orca_core.policy",
    "orca_core.audit",
    "orca_core.journal",
]
forbidden_modules = [
    "orca_core.providers",
    "orca_core.tools",
    "orca_core.persistence",
    "orca_core.ipc",
    "orca_core.orchestrator",
    "sqlalchemy",
    "httpx",
    "fastapi",
]

[[tool.importlinter.contracts]]
name = "Tools must not cross-import each other"
type = "independence"
modules = [
    "orca_core.tools.fs",
    "orca_core.tools.shell",
    "orca_core.tools.browser",
    "orca_core.tools.os",
    "orca_core.tools.web",
]

[[tool.importlinter.contracts]]
name = "Layered dependency"
type = "layers"
layers = [
    "orca_core.ipc",
    "orca_core.orchestrator",
    "orca_core.providers | orca_core.tools | orca_core.persistence",
    "orca_core.audit | orca_core.journal",
    "orca_core.policy",
    "orca_core.schema",
]
